[package]
name = "klecks_ui"
version = "0.1.0"
edition = "2021"
authors = ["Krinxy"]
license = "MIT"

# Own workspace: this crate compiles to wasm via Trunk, the root workspace is native.
[workspace]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
