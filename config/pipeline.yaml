# Reconstruction quality. Pick a preset with `preset`, tune single values under `presets`.

pipeline:
  # Temporary reconstruction backend: runs lab/room_scan.py in the conda lab, then trains a Gaussian
  # splat with Brush (dev only, not shippable).
  # Machine-specific paths belong in your override file, not here:
  #   %APPDATA%\klecks\pipeline.yaml  ->  pipeline: { reconstruct: { python: "D:/Projects/klecks-lab/python.exe", ... } }
  # Later replaced by an ONNX model run from Rust (backend: onnx).
  reconstruct:
    backend: python_lab
    python: ""              # python.exe of the lab env; empty = backend not configured
    script: ""              # path to lab/room_scan.py; empty = lab/room_scan.py next to or above config/
    hf_home: ""             # where model weights are cached; empty = inherit HF_HOME
    window: 56              # frames VGGT looks at together; lowered automatically to fit the GPU
    frame_rate: 1.5         # frames taken per second of film; long films are cut into overlapping windows
    max_frames: 400         # frames for the whole room
    conf_percentile: 40.0   # drop the least confident N percent of points
    view_points: 3000000    # size of the downsampled point cloud (used when no splat is trained)
    upscale_model: ""       # e.g. 4x-UltraSharp.safetensors: sharpens the training images; empty = off
    brush: ""               # path to brush_app.exe (Gaussian splat trainer); empty = point cloud only
    colmap: ""              # path to colmap.exe (COLMAP 4 with CUDA): places every camera exactly; empty = colmap on the PATH, else the VGGT cameras
    sh_degree: 1            # colour detail of the splat, 0-3; lower = smaller file, faster to load (3 = 236 bytes per splat, 1 = 92)

  # Quality preset: how long the splat trains and how many splats it may grow (Settings > Quality).
  # Minutes are for an RTX 4080.
  preset: high
  presets:
    draft:            # about 2 minutes
      train_iterations: 7000
      max_splats: 1000000
      sh_degree: 0              # no view-dependent colour: the smallest file
      growth_grad_threshold: 0.00002
      growth_select_fraction: 0.2
    high:             # about 10 minutes
      train_iterations: 30000
      max_splats: 3000000
      sh_degree: 1
      growth_grad_threshold: 0.00001   # measured on a living room: denser growth, sharper detail
      growth_select_fraction: 0.3
      ssim_weight: 0.4                 # structure counts more than single pixels
      mean_noise_weight: 10            # less shaking of the splats, calmer surfaces
    max:              # about 25 minutes
      train_iterations: 60000
      max_splats: 6000000
      sh_degree: 2              # shine and reflections of furniture, about 150 bytes per splat
      growth_grad_threshold: 0.00001   # measured on a living room: denser growth, sharper detail
      growth_select_fraction: 0.3
      ssim_weight: 0.4                 # structure counts more than single pixels
      mean_noise_weight: 10            # less shaking of the splats, calmer surfaces

  floorplan:
    slice_min_m: 0.10       # height band above the floor used for the occupancy map
    slice_max_m: 1.80
    cell_size_m: 0.02

  scale:
    # One real measurement turns arbitrary reconstruction units into metres.
    reference: manual       # manual | door_height_2_05
