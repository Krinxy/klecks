# Reconstruction quality. Pick a preset with `preset`, tune single values under `presets`.

pipeline:
  # Temporary reconstruction backend: runs lab/room_scan.py in the conda lab, then trains a Gaussian
  # splat with Brush (dev only, not shippable).
  # Machine-specific paths belong in your override file, not here:
  #   %APPDATA%\klecks\pipeline.yaml  ->  pipeline: { reconstruct: { python: "D:/Projects/klecks-lab/python.exe", ... } }
  # Later replaced by an ONNX model run from Rust (backend: onnx).
  reconstruct:
    backend: python_lab
    python: ""              # python.exe of the lab env; empty = backend not configured
    script: ""              # path to lab/room_scan.py; empty = lab/room_scan.py next to or above config/
    hf_home: ""             # where model weights are cached; empty = inherit HF_HOME
    frames: 72              # frames shared across all videos (VRAM: ~13.5 GB at 72)
    conf_percentile: 40.0   # drop the least confident N percent of points
    view_points: 3000000    # size of the downsampled point cloud (used when no splat is trained)
    upscale_model: ""       # e.g. 4x-UltraSharp.safetensors: sharpens the training images; empty = off
    brush: ""               # path to brush_app.exe (Gaussian splat trainer); empty = point cloud only
    train_steps: 30000      # splat training steps (about 8-10 minutes on an RTX 4080)

  preset: high
  presets:
    draft:
      train_iterations: 7000
      max_splats: 1000000
    high:
      train_iterations: 30000
      max_splats: 3000000
    max:
      train_iterations: 60000
      max_splats: 6000000

  floorplan:
    slice_min_m: 0.10       # height band above the floor used for the occupancy map
    slice_max_m: 1.80
    cell_size_m: 0.02

  scale:
    # One real measurement turns arbitrary reconstruction units into metres.
    reference: manual       # manual | door_height_2_05
