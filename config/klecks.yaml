# Core application settings. Shipped defaults live next to the program in `config/`;
# a file with the same name in the user config dir (%APPDATA%\klecks on Windows,
# ~/.config/klecks on Linux) overrides single keys, everything else keeps its default.

app:
  name: klecks
  language: en

# Empty string = platform default (see `paths` in README). Absolute path = override.
# Models are multi-GB: point `models_dir` at a big drive, e.g. <models-dir>
paths:
  # Library: media_dir/rooms/<room>/ holds the videos of one room, media_dir/assets/<item>/ a piece of
  # furniture (photos + asset.yaml). Empty = a `media/` folder next to the program or its repo, else the data dir.
  media_dir: ""
  models_dir: ""
  scans_dir: ""
  cache_dir: ""

# ML never runs on CPU. If no allowed GPU is found the pipeline refuses to start
# and the UI shows why. Video decoding / file IO are CPU by nature and not covered.
gpu:
  require_gpu: true
  allowed_vendors: [nvidia] # amd is supported in code but untested (no AMD test machine)
  backends: [vulkan, dx12]  # wgpu backends considered, in addition to the vendor filter
