[package]
name = "klecks-app"
description = "klecks desktop shell (Tauri)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "klecks_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: lets the viewer fetch the scan's .ply from disk (scope is set at runtime).
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
klecks-settings.workspace = true
klecks-gpu.workspace = true
klecks-reconstruct.workspace = true
